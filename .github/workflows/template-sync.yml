name: Template sync

# Reports when the files that this repository shares with ODC_Instruments_Template
# are different from the template. Change a shared file in the template first.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-sync:
    if: github.repository != 'DouglasNeuroInformatics/ODC_Instruments_Template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out template
        uses: actions/checkout@v7
        with:
          repository: DouglasNeuroInformatics/ODC_Instruments_Template
          path: .template
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Compare shared files with the template
        run: node scripts/check-template-sync.ts --template .template
